<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALCYON KEYS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #ffd166; font: 700 22px "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: 6px; background: radial-gradient(circle at 50% 60%, #3a1d4a, #0d0a1a 70%); }
  #error { position: fixed; left: 12px; bottom: 12px; max-width: 70%; color: #fff; background: rgba(160,20,40,0.9); font: 13px monospace; padding: 8px 10px; white-space: pre-wrap; display: none; z-index: 5; }
</style>
</head>
<body>
<canvas id="game" aria-label="Halcyon Keys: an open-world crime game in a sun-soaked island city"></canvas>
<div id="boot">HALCYON KEYS</div>
<pre id="error"></pre>
<p id="status" role="status" aria-live="polite"></p>
<script>
  window.addEventListener('error', (e) => { const el = document.getElementById('error'); el.style.display = 'block'; el.textContent += (e.error && e.error.stack ? e.error.stack.split('\n').slice(0, 4).join('\n') : e.message || e) + '\n'; });
  window.addEventListener('unhandledrejection', (e) => { const el = document.getElementById('error'); el.style.display = 'block'; el.textContent += String(e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
